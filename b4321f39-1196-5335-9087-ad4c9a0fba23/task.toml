[agent]
timeout_sec = 10800.0
# The user "dev" that environment/Dockerfile creates (useradd --uid 1000, group 1000, home
# /home/dev), named by its uid.
user = "1000"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "no-network"

[verifier]
# The pool grader's worst case fits 19800 s; the judge (tests/judge.toml: 9 criteria and the guard,
# 3 samples each, all 30 calls concurrent, at most 3 attempts of at most 300 s) runs beside it inside
# Reward Kit, and 900 s more covers it running after the grader: 20700 s.
timeout_sec = 20700.0
# The verifier starts as root; the grader runs submitted test code as uid 10002 with a fixed
# environment that holds no credential.
user = "root"
environment_mode = "separate"
# the judge is anthropic/claude-sonnet-5-5 (tests/judge.toml); the agent reaches nothing new.
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]

[verifier.env]
# The judge endpoint and key come from the runner's environment, never literals. An empty
# ANTHROPIC_API_KEY (the default) means no judge key: tests/test.sh then skips the judge. The judge
# is advisory (weight 0 in the reward); without the key the reward is the same compiled score, and
# tests/test.sh records judge-skipped.json (solution/TRUTH.md).
ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
# litellm reads only its packaged model map, which tests/Dockerfile patches (solution/TRUTH.md).
LITELLM_LOCAL_MODEL_COST_MAP = "True"
# Reward Kit 0.2.4 always sends reasoning_effort; dropping unsupported params keeps the judge's
# result defined for a model litellm's bundled map does not list as a reasoning model.
LITELLM_DROP_PARAMS = "True"
# litellm uses its packaged Anthropic beta-header table instead of fetching one.
LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS = "True"

[verifier.environment]
# built from tests/Dockerfile
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]
